name: argivit

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOCKER_PG_DATABASE:-argivit}
      POSTGRES_USER: ${DOCKER_PG_USERNAME:-argivit}
      POSTGRES_PASSWORD: ${DOCKER_PG_PASSWORD:?Set DOCKER_PG_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${DOCKER_PG_PORT:-55432}:5432"
    volumes:
      - argivit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  argivit_postgres:
