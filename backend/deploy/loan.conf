server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 15m;
    resolver 127.0.0.11 ipv6=off valid=5s;
    set $loan_upstream http://loan_api:80;

    location = /health {
        proxy_pass $loan_upstream/api/v1/health;
    }

    location ~ ^/api/v1/(?:auth/(?:config|login|logout|me|mfa/verify|password/(?:forgot|reset)|session/activity|sessions(?:/[^/]+)?)|health|admin/settings|loans(?:/.*)?|shareholders(?:/.*)?|shareholder-documents|share-capital(?:/.*)?|documents/[^/]+/(?:download|review)|notifications(?:/(?:read-all|preferences|[0-9a-f-]{36}))?)$ {
        proxy_pass $loan_upstream$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"success":false,"message":"This endpoint is unavailable on the loan portal."}';
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
