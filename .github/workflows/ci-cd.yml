name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, pdo_pgsql, zip, mbstring, dom
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - run: find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
        working-directory: backend
      - run: node --test --test-concurrency=1 tests/*.test.ts
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm test && npm run test:desktop && npm run build
        working-directory: frontend
      - run: bash -n backend/deploy/deploy.sh


      - name: Build and package deployment images
        if: github.repository == 'DONNHER/Agrivet_Ledger' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          docker build --target api --build-arg APP_VERSION="$GITHUB_SHA" -f backend/deploy/Dockerfile -t "agrivet-ledger-api:$GITHUB_SHA" .
          docker build --target loan -f backend/deploy/Dockerfile -t "agrivet-ledger-loan:$GITHUB_SHA" .
          docker pull postgres:17
          docker save "agrivet-ledger-api:$GITHUB_SHA" "agrivet-ledger-loan:$GITHUB_SHA" postgres:17 | gzip -1 > agrivet-images.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.repository == 'DONNHER/Agrivet_Ledger' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: agrivet-images
          path: agrivet-images.tar.gz
          compression-level: 0
          retention-days: 3

  deploy:
    needs: test
    if: github.repository == 'DONNHER/Agrivet_Ledger' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, agrivet-deploy]
    environment: production
    concurrency:
      group: agrivet-production
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: agrivet-images
      - name: Load the checked release images
        run: docker load -i agrivet-images.tar.gz
      - name: Deploy and verify exact commit on both entry points
        run: bash backend/deploy/deploy.sh "$GITHUB_SHA" prebuilt
      - name: Sync Kali checkout and restart frontend
        run: |
          set -Eeuo pipefail
          target="$HOME/Agrivet_Ledger"
          if [ -d "$target/.git" ]; then
            git -C "$target" fetch --depth=1 origin "$GITHUB_SHA"
            git -C "$target" checkout --force "$GITHUB_SHA"
          else
            rm -rf "$target"
            git clone --depth=1 https://github.com/DONNHER/Agrivet_Ledger.git "$target"
            git -C "$target" fetch --depth=1 origin "$GITHUB_SHA"
            git -C "$target" checkout --force "$GITHUB_SHA"
          fi

          lock_hash="$(sha256sum "$target/frontend/package-lock.json" | awk '{print $1}')"
          hash_file="$target/frontend/node_modules/.package-lock.sha256"
          if [ ! -d "$target/frontend/node_modules" ] || [ "$(cat "$hash_file" 2>/dev/null || true)" != "$lock_hash" ]; then
            (cd "$target/frontend" && PATH="$HOME/.local/argivet-node/bin:$PATH" ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci)
            printf '%s\n' "$lock_hash" > "$hash_file"
          fi

          uid="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus"
          if systemctl --user list-unit-files agrivet-frontend-dev.service >/dev/null 2>&1; then
            systemctl --user restart agrivet-frontend-dev
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:5173/api/v1/health | grep -Fq '"status":"online"'; then
                echo "Verified agrivet-frontend-dev is online at commit $GITHUB_SHA"
                exit 0
              fi
              sleep 1
            done
            echo "agrivet-frontend-dev failed health check after restart." >&2
            journalctl --user -u agrivet-frontend-dev -n 30 --no-pager >&2 || true
            exit 1
          fi
